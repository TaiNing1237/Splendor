    // =============================================
    // 動作執行
    // =============================================
    function isMyTurn() {
      if (!state) return false;
      if (state.game_over) return false;
      if (mode === 'pvp') return true; // PvP 兩人都在同台電腦
      return state.current_player_idx === myPlayerIdx;
    }

    async function doAction(action) {
      if (!gameId) return;

      // 記錄觸發動畫需要的資訊（動作前取得位置）
      const actingPlayer = state.current_player_idx;

      try {
        const res = await fetch(`${API}/action`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            game_id: gameId,
            action,
            player_id: actingPlayer
          })
        });
        const data = await res.json();
        if (!res.ok) {
          sfxError();
          showMessage(data.detail || '動作不合法', 'error');
          return;
        }

        // ── 依動作類型播放音效 + 動畫（渲染交給 WebSocket state_update 處理）──
        if (action.type === 'take_gems') {
          Object.entries(action.gems).forEach(([color, count]) => {
            animateGemFly(color, count, actingPlayer);
          });
        } else if (action.type === 'reserve') {
          sfxReserveCard();
          animateCardFly(action.card_id, actingPlayer, action.level);
        } else if (action.type === 'buy') {
          sfxBuyCard();
          animateCardFly(action.card_id, actingPlayer, null);
        }

        // 不在此處 renderAll()，讓 WebSocket state_update 負責渲染
        // 這樣 _prevBoardIds 尚未更新，新牌才能正確觸發翻牌動畫
        state = data.state;

      } catch (e) {
        showMessage('連線錯誤', 'error');
      }
    }

    // ── 購買確認 modal ─────────────────────────
    let _pendingBuyCardId = null;

    function onBuyCard(cardId) {
      if (!isMyTurn()) { showMessage('還未輪到你', 'error'); return; }
      showBuyConfirm(cardId);
    }

    /**
     * 計算前端版的實際費用（與後端 _effective_cost 邏輯一致）
     * 回傳 { white, blue, green, red, black, gold, canAfford }
     */
    function calcPayment(player, card) {
      const bonus = player.gem_bonus || {};
      let goldNeeded = 0;
      const pay = {};
      for (const g of GEM_COLORS) {
        const raw = card.cost[g] || 0;
        const afterDisc = raw - (bonus[g] || 0);
        if (afterDisc <= 0) { pay[g] = 0; continue; }
        const have = player.gems[g] || 0;
        if (have >= afterDisc) {
          pay[g] = afterDisc;
        } else {
          pay[g] = have;
          goldNeeded += afterDisc - have;
        }
      }
      pay.gold = goldNeeded;
      pay.canAfford = goldNeeded <= (player.gems.gold || 0);
      return pay;
    }

    function showBuyConfirm(cardId) {
      // 找到這張卡（場上或保留手牌）
      let card = null;
      for (const lv of [1, 2, 3]) {
        for (const c of (state.board[String(lv)] || [])) {
          if (c && c.id === cardId) { card = c; break; }
        }
        if (card) break;
      }
      if (!card) {
        const player = state.players[state.current_player_idx];
        card = player.reserved.find(c => c.id === cardId) || null;
      }
      if (!card) { showMessage('找不到該卡片', 'error'); return; }

      const player = state.players[state.current_player_idx];
      const payment = calcPayment(player, card);

      _pendingBuyCardId = cardId;

      // 標題
      document.getElementById('buy-confirm-title').textContent =
        `確認購買（等級 ${card.level}・${GEM_NAMES[card.color]} 加成${card.points > 0 ? '・' + card.points + ' 分' : ''}）`;
      document.getElementById('buy-confirm-card-info').textContent = '';

      // 費用 chips
      const listEl = document.getElementById('buy-cost-list');
      listEl.innerHTML = '';

      let hasAnyCost = false;
      for (const g of GEM_COLORS) {
        const amt = payment[g];
        if (amt <= 0) continue;
        hasAnyCost = true;
        const chip = document.createElement('div');
        chip.className = 'buy-cost-chip';
        chip.innerHTML = `
      <div class="chip-dot ${gemClass(g)}" style="${gemStyle(g)}"></div>
      <span>${GEM_NAMES[g]} × ${amt}</span>
    `;
        listEl.appendChild(chip);
      }
      if (payment.gold > 0) {
        hasAnyCost = true;
        const chip = document.createElement('div');
        chip.className = 'buy-cost-chip gold-chip';
        chip.innerHTML = `
      <div class="chip-dot" style="${gemStyle('gold')}border-radius:50%;"></div>
      <span>黃金（萬用）× ${payment.gold}</span>
    `;
        listEl.appendChild(chip);
      }
      if (!hasAnyCost) {
        listEl.innerHTML = `<span style="color:var(--green-ok);font-weight:700;">免費！</span>`;
      }

      // 是否負擔得起
      const errEl = document.getElementById('buy-not-affordable');
      const confirmBtn = document.getElementById('btn-confirm-buy');
      if (!payment.canAfford) {
        const short = payment.gold - (player.gems.gold || 0);
        errEl.textContent = `黃金不足！還差 ${short} 顆萬用幣`;
        errEl.style.display = '';
        confirmBtn.disabled = true;
        confirmBtn.style.opacity = '0.4';
      } else {
        errEl.style.display = 'none';
        confirmBtn.disabled = false;
        confirmBtn.style.opacity = '';
      }

      document.getElementById('buy-confirm-panel').style.display = 'block';
    }

    function onReserveCard(cardId) {
      if (!isMyTurn()) { showMessage('還未輪到你', 'error'); return; }
      const player = state.players[state.current_player_idx];
      if (player.reserved.length >= 3) {
        showMessage('保留手牌已達上限（3張）', 'error'); return;
      }
      // highlight card and wait for confirmation
      document.querySelectorAll('.dev-card.selected').forEach(c => c.classList.remove('selected'));
      const cardEl = document.querySelector(`.dev-card[data-card-id="${cardId}"]`);
      if (cardEl) cardEl.classList.add('selected');
      selectedGems = {};
      pendingAction = { type: 'reserve', card_id: cardId };
      updateActionBar();
    }

    function onReserveFromDeck(level) {
      if (!isMyTurn()) { showMessage('還未輪到你', 'error'); return; }
      const player = state.players[state.current_player_idx];
      if (player.reserved.length >= 3) {
        showMessage('保留手牌已達上限（3張）', 'error'); return;
      }
      document.querySelectorAll('.dev-card.selected').forEach(c => c.classList.remove('selected'));
      selectedGems = {};
      pendingAction = { type: 'reserve', level };
      updateActionBar();
    }

    // =============================================
    // 可否負擔（前端本地計算，僅用於高亮）
    // =============================================
    function canAfford(player, card) {
      const bonus = player.gem_bonus;
      let goldNeeded = 0;
      for (const g of GEM_COLORS) {
        const cost = (card.cost[g] || 0) - (bonus[g] || 0);
        if (cost <= 0) continue;
        const have = player.gems[g] || 0;
        if (have >= cost) continue;
        goldNeeded += cost - have;
      }
      return goldNeeded <= (player.gems.gold || 0);
    }

    // =============================================
    // 棄牌面板
    // =============================================
    function openDiscardPanel(playerIdx, st) {
      const player = st.players[playerIdx];
      discardPlayerId = playerIdx;
      discardExcess = player.gems
        ? Object.values(player.gems).reduce((a, b) => a + b, 0) - 10
        : 0;
      if (discardExcess <= 0) return;

      discardState = {};
      document.getElementById('discard-info').textContent =
        `你持有 ${player.gems ? Object.values(player.gems).reduce((a, b) => a + b, 0) : 0} 顆寶石，需歸還 ${discardExcess} 顆`;

      const gemsEl = document.getElementById('discard-gems');
      gemsEl.innerHTML = '';
      GEM_ALL.forEach(g => {
        const cnt = player.gems[g] || 0;
        if (cnt <= 0) return;
        const btn = document.createElement('div');
        btn.className = 'discard-gem-btn';
        btn.dataset.gem = g;
        btn.style.cssText = gemStyle(g) + `color:${gemTextColor(g)};border:3px solid transparent;`;
        const badge = document.createElement('div');
        badge.className = 'gem-count-badge';
        badge.id = `discard-badge-${g}`;
        badge.textContent = cnt;
        btn.appendChild(badge);

        // 顯示「已選幾顆歸還」
        const selBadge = document.createElement('div');
        selBadge.style.cssText = `
      position:absolute;top:-6px;left:-6px;
      background:var(--red-err);color:#fff;
      border-radius:50%;width:18px;height:18px;
      font-size:0.65rem;font-weight:900;
      display:none;align-items:center;justify-content:center;
    `;
        selBadge.id = `discard-selbadge-${g}`;
        btn.appendChild(selBadge);

        btn.addEventListener('click', () => toggleDiscardGem(g, cnt));
        gemsEl.appendChild(btn);
      });

      document.getElementById('discard-panel').style.display = 'block';
    }

    function toggleDiscardGem(gem, maxCnt) {
      const cur = discardState[gem] || 0;
      const totalDiscard = Object.values(discardState).reduce((a, b) => a + b, 0);

      if (cur > 0) {
        // 取消選取
        discardState[gem] = cur - 1;
      } else {
        // 選取
        if (totalDiscard >= discardExcess) {
          showMessage(`只需歸還 ${discardExcess} 顆`, 'info'); return;
        }
        discardState[gem] = 1;
      }
      if (discardState[gem] <= 0) delete discardState[gem];

      // 更新 UI
      GEM_ALL.forEach(g => {
        const selBadge = document.getElementById(`discard-selbadge-${g}`);
        if (!selBadge) return;
        const sel = discardState[g] || 0;
        selBadge.textContent = `-${sel}`;
        selBadge.style.display = sel > 0 ? 'flex' : 'none';
      });
    }

    async function confirmDiscard() {
      const totalDiscard = Object.values(discardState).reduce((a, b) => a + b, 0);
      if (totalDiscard !== discardExcess) {
        showMessage(`需歸還 ${discardExcess} 顆，目前選了 ${totalDiscard} 顆`, 'error');
        return;
      }
      try {
        const res = await fetch(`${API}/discard`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ game_id: gameId, player_id: discardPlayerId, gems: discardState })
        });
        const data = await res.json();
        if (!res.ok) { showMessage(data.detail || '歸還失敗', 'error'); return; }
        state = data.state;
        document.getElementById('discard-panel').style.display = 'none';
        discardState = {};
        renderAll();
      } catch (e) {
        showMessage('連線錯誤', 'error');
      }
    }

    // =============================================
    // 勝利畫面
    // =============================================
    function showWinScreen(st) {
      const winner = st.players[st.winner_id];
      document.getElementById('win-title').textContent = `${winner.name} 獲勝！`;

      const scoresEl = document.getElementById('win-scores');
      scoresEl.innerHTML = '';
      st.players.forEach(p => {
        const item = document.createElement('div');
        item.className = 'win-score-item' + (p.player_id === st.winner_id ? ' winner-item' : '');
        item.innerHTML = `<div class="name">${p.name}</div><div class="score">${p.score}</div>`;
        scoresEl.appendChild(item);
      });

      spawnConfetti();
      const ws2 = document.getElementById('win-screen');
      ws2.style.display = 'flex';
      ws2.style.flexDirection = 'column';
      ws2.style.alignItems = 'center';
      ws2.style.justifyContent = 'center';
    }

    function spawnConfetti() {
      const container = document.getElementById('confetti-bg');
      container.innerHTML = '';
      const colors = ['#c9a84c', '#f0c040', '#fff', '#1a6bbf', '#2d8a4e', '#c0392b'];
      for (let i = 0; i < 80; i++) {
        const p = document.createElement('div');
        p.className = 'confetti-particle';
        const color = colors[Math.floor(Math.random() * colors.length)];
        const left = Math.random() * 100;
        const delay = Math.random() * 3;
        const dur = 3 + Math.random() * 2;
        const size = 6 + Math.random() * 10;
        p.style.cssText = `
      left:${left}%;background:${color};
      width:${size}px;height:${size}px;
      animation-duration:${dur}s;
      animation-delay:${delay}s;
    `;
        container.appendChild(p);
      }
    }

    // =============================================
    // 歷史記錄
    // =============================================
    async function showHistory() {
      try {
        const res = await fetch(`${API}/history`);
        const data = await res.json();
        const tbody = document.getElementById('history-tbody');
        tbody.innerHTML = '';
        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--text-dim);padding:1rem;">尚無對局記錄</td></tr>`;
        }
        data.forEach(row => {
          const tr = document.createElement('tr');
          const modeStr = row.mode === 'pve' ? '人 vs AI' : '人 vs 人';
          const diffStr = row.difficulty ? DIFF_NAMES[row.difficulty] || row.difficulty : '-';
          const winnerStr = row.winner_id === 0 ? '玩家一' : (row.mode === 'pvp' ? '玩家二' : 'AI');
          const scoreStr = `${row.score_p0 ?? '-'} : ${row.score_p1 ?? '-'}`;
          const timeStr = row.started_at ? row.started_at.substring(0, 16).replace('T', ' ') : '-';
          tr.innerHTML = `
        <td>${modeStr}</td>
        <td>${diffStr}</td>
        <td style="color:var(--gold-bright)">${winnerStr}</td>
        <td>${scoreStr}</td>
        <td>${row.turns ?? '-'}</td>
        <td style="color:var(--text-dim);font-size:0.8rem;">${timeStr}</td>
      `;
          tbody.appendChild(tr);
        });
        const panel = document.getElementById('history-panel');
        panel.style.display = 'flex';
      } catch (e) {
        showMessage('無法載入歷史記錄', 'error');
      }
    }

    // =============================================
    // 訊息提示
    // =============================================
    function showMessage(text, type = 'info', duration = 3000) {
      const box = document.getElementById('message-box');
      const item = document.createElement('div');
      item.className = `msg-item ${type}`;
      item.textContent = text;
      box.appendChild(item);
      setTimeout(() => {
        item.style.opacity = '0';
        item.style.transition = 'opacity 0.3s';
        setTimeout(() => item.remove(), 300);
      }, duration);
    }

    // =============================================
    // 重置 UI 狀態
    // =============================================
    function resetUIState() {
      selectedGems = {};
      pendingAction = null;
      discardState = {};
      discardPlayerId = null;
      _pendingBuyCardId = null;
      document.getElementById('action-bar').classList.add('hidden');
      document.getElementById('win-screen').style.display = 'none';
      document.getElementById('ai-thinking').style.display = 'none';
      document.getElementById('discard-panel').style.display = 'none';
      document.getElementById('buy-confirm-panel').style.display = 'none';
      document.getElementById('message-box').innerHTML = '';
    }

    // =============================================
    // 事件綁定
    // =============================================
    document.getElementById('btn-start').addEventListener('click', startGame);

    document.getElementById('btn-history').addEventListener('click', showHistory);

    document.getElementById('btn-new-game-top').addEventListener('click', () => {
      if (ws) { ws.close(); ws = null; }
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('start-screen').style.display = 'flex';
      state = null; gameId = null;
    });

    document.getElementById('btn-confirm-action').addEventListener('click', confirmAction);
    document.getElementById('btn-cancel-action').addEventListener('click', cancelAction);
    document.getElementById('btn-confirm-buy').addEventListener('click', () => {
      if (_pendingBuyCardId === null) return;
      document.getElementById('buy-confirm-panel').style.display = 'none';
      doAction({ type: 'buy', card_id: _pendingBuyCardId });
      _pendingBuyCardId = null;
    });
    document.getElementById('btn-cancel-buy').addEventListener('click', () => {
      document.getElementById('buy-confirm-panel').style.display = 'none';
      _pendingBuyCardId = null;
    });
    document.getElementById('btn-confirm-discard').addEventListener('click', confirmDiscard);

    document.getElementById('btn-play-again').addEventListener('click', () => {
      document.getElementById('win-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('start-screen').style.display = 'flex';
      if (ws) { ws.close(); ws = null; }
      state = null; gameId = null;
    });

    document.getElementById('btn-close-history').addEventListener('click', () => {
      document.getElementById('history-panel').style.display = 'none';
    });

    // 遊戲模式切換：隱藏/顯示難度選項
    document.querySelectorAll('input[name="mode"]').forEach(r => {
      r.addEventListener('change', () => {
        const diffGroup = document.getElementById('difficulty-group');
        diffGroup.style.display = r.value === 'pvp' ? 'none' : '';
      });
    });

    // 鍵盤：Enter 確認，Escape 取消
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') confirmAction();
      if (e.key === 'Escape') cancelAction();
    });
  </script>
</body>

</html>
